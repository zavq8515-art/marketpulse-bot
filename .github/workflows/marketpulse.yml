name: MarketPulse Bot

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: marketpulse-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run MarketPulse once
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_CHANNEL: "@MarketPulseZK"
          GEMINI_MODEL: "gemini-3.1-flash-lite"
          DRY_RUN: "false"
          QUIET_HOURS: "01-07"
          MAX_POSTS_PER_DAY: "20"
          MAX_POSTS_PER_RUN: "2"
          MIN_GAP_MIN: "15"
          MIN_IMPORTANCE: "7"
        run: python main.py --once

      - name: Save database state
        run: |
          if [ -f data/marketpulse.db ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -f data/marketpulse.db
            git diff --staged --quiet || (git commit -m "chore: update seen news database [skip ci]" && git pull --rebase && git push)
          fi
